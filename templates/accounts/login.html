{% extends "base_auth.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="auth-card">
  <h2>Sign in</h2>
  <p class="auth-sub">Use your {{ school_name }} account. Credentials are stored in this school’s tenant database.</p>
  <form method="post" class="form-stack">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="form-error">{{ form.non_field_errors }}</div>
    {% endif %}
    <label class="field">
      <span>Username</span>
      <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-block">Continue</button>
  </form>
</div>
{% endblock %}
